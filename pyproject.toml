[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigov"
version = "0.2.0"
description = "Self-hosted AI governance and compliance testing platform: article-level rule library, gap analysis and recommendations"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
docs = ["pypdf>=4", "python-docx>=1"]
dev = ["aigov[docs]", "pytest>=8", "httpx>=0.27"]

[project.scripts]
aigov = "aigov.cli:main"

[tool.setuptools.packages.find]
include = ["aigov*"]

[tool.setuptools.package-data]
aigov = ["catalog/*.yaml", "catalog/requirements/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
