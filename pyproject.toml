[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigov"
version = "0.1.0"
description = "AI governance and compliance assessment: measure, find gaps, recommend improvements"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.optional-dependencies]
ai = ["anthropic>=2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
docs = ["pypdf>=4", "python-docx>=1"]
all = ["aigov[ai,api,docs]"]
dev = ["aigov[all]", "pytest>=8", "httpx>=0.27"]

[project.scripts]
aigov = "aigov.cli:main"

[tool.setuptools.packages.find]
include = ["aigov*"]

[tool.setuptools.package-data]
aigov = ["catalog/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
