# NIST AI Risk Management Framework 1.0 (NIST AI 100-1), Core subcategories (US Government work, public domain).
# Each subcategory is assessed as written. Generative AI considerations from NIST AI 600-1 are captured
# in the linked controls (GEN-01).

framework: nist_ai_rmf
prefix: NIST
sections:
  - chapter: GOVERN
    items:
      - {ref: GOVERN 1.1, title: Legal and regulatory requirements, summary: "Legal and regulatory requirements involving AI are understood, managed, and documented.", controls: [GOV-04], weight: 3}
      - {ref: GOVERN 1.2, title: Trustworthy AI in policy, summary: "The characteristics of trustworthy AI are integrated into organizational policies, processes, procedures, and practices.", controls: [GOV-01], weight: 2}
      - {ref: GOVERN 1.3, title: Risk-based level of risk management, summary: "Processes, procedures, and practices are in place to determine the needed level of risk management activities based on the organization's risk tolerance.", controls: [RSK-02, RSK-01], weight: 2}
      - {ref: GOVERN 1.4, title: Transparent risk management policies, summary: "The risk management process and its outcomes are established through transparent policies, procedures, and other controls based on organizational risk priorities.", controls: [GOV-01, RSK-02], weight: 2}
      - {ref: GOVERN 1.5, title: Monitoring and periodic review, summary: "Ongoing monitoring and periodic review of the risk management process and its outcomes are planned and organizational roles and responsibilities clearly defined, including determining the frequency of periodic review.", controls: [GOV-06], weight: 2}
      - {ref: GOVERN 1.6, title: AI system inventory, summary: "Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities.", controls: [GOV-03], weight: 3}
      - {ref: GOVERN 1.7, title: Decommissioning, summary: "Processes and procedures are in place for decommissioning and phasing out AI systems safely and in a manner that does not increase risks or decrease the organization's trustworthiness.", controls: [OPS-04], weight: 1}
      - {ref: GOVERN 2.1, title: Roles and responsibilities, summary: "Roles and responsibilities and lines of communication related to mapping, measuring, and managing AI risks are documented and are clear to individuals and teams throughout the organization.", controls: [GOV-02], weight: 3}
      - {ref: GOVERN 2.2, title: AI risk management training, summary: "The organization's personnel and partners receive AI risk management training to enable them to perform their duties and responsibilities consistent with related policies, procedures, and agreements.", controls: [GOV-05], weight: 2}
      - {ref: GOVERN 2.3, title: Executive accountability, summary: "Executive leadership of the organization takes responsibility for decisions about risks associated with AI system development and deployment.", controls: [GOV-02], weight: 3}
      - {ref: GOVERN 3.1, title: Diverse decision-making teams, summary: "Decision-making related to mapping, measuring, and managing AI risks throughout the lifecycle is informed by a diverse team (e.g., diversity of demographics, disciplines, experience, expertise, and backgrounds).", controls: [GOV-02], weight: 1}
      - {ref: GOVERN 3.2, title: Human-AI configurations and oversight roles, summary: "Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight of AI systems.", controls: [HUM-01], weight: 2}
      - {ref: GOVERN 4.1, title: Safety-first culture, summary: "Organizational policies and practices are in place to foster a critical thinking and safety-first mindset in the design, development, deployment, and uses of AI systems to minimize potential negative impacts.", controls: [GOV-01], weight: 1}
      - {ref: GOVERN 4.2, title: Documenting and communicating impacts, summary: "Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate, and use, and they communicate about the impacts more broadly.", controls: [RSK-03], weight: 2}
      - {ref: GOVERN 4.3, title: "Testing, incident identification and information sharing", summary: "Organizational practices are in place to enable AI testing, identification of incidents, and information sharing.", controls: [OPS-03, DEV-02], weight: 2}
      - {ref: GOVERN 5.1, title: External feedback, summary: "Organizational policies and practices are in place to collect, consider, prioritize, and integrate feedback from those external to the team that developed or deployed the AI system regarding the potential individual and societal impacts related to AI risks.", controls: [HUM-02, OPS-02], weight: 2}
      - {ref: GOVERN 5.2, title: Incorporating adjudicated feedback, summary: "Mechanisms are established to enable the team that developed or deployed AI systems to regularly incorporate adjudicated feedback from relevant AI actors into system design and implementation.", controls: [DEV-05], weight: 1}
      - {ref: GOVERN 6.1, title: Third-party risk policies, summary: "Policies and procedures are in place that address AI risks associated with third-party entities, including risks of infringement of a third-party's intellectual property or other rights.", controls: [TPR-01], weight: 3}
      - {ref: GOVERN 6.2, title: Third-party contingency, summary: "Contingency processes are in place to handle failures or incidents in third-party data or AI systems deemed to be high-risk.", controls: [TPR-02], weight: 2}

  - chapter: MAP
    items:
      - {ref: MAP 1.1, title: Intended purpose and context, summary: "Intended purposes, potentially beneficial uses, context-specific laws, norms and expectations, and prospective settings in which the AI system will be deployed are understood and documented.", controls: [GOV-03, DEV-01], weight: 3}
      - {ref: MAP 1.2, title: Interdisciplinary context team, summary: "Interdisciplinary AI actors, competencies, skills, and capacities for establishing context reflect demographic diversity and broad domain and user experience expertise, and their participation is documented.", controls: [GOV-02], weight: 1}
      - {ref: MAP 1.3, title: Mission and goals, summary: "The organization's mission and relevant goals for AI technology are understood and documented.", controls: [GOV-01], weight: 1}
      - {ref: MAP 1.4, title: Business value, summary: "The business value or context of business use has been clearly defined or, in the case of assessing existing AI systems, re-evaluated.", controls: [GOV-03], weight: 1}
      - {ref: MAP 1.5, title: Risk tolerance, summary: "Organizational risk tolerances are determined and documented.", controls: [RSK-01, GOV-01], weight: 2}
      - {ref: MAP 1.6, title: System requirements, summary: "System requirements are elicited from and understood by relevant AI actors, and design decisions take socio-technical implications into account to address AI risks.", controls: [DEV-01], weight: 2}
      - {ref: MAP 2.1, title: Tasks and methods defined, summary: "The specific tasks and methods used to implement the tasks that the AI system will support are defined.", controls: [DEV-01], weight: 1}
      - {ref: MAP 2.2, title: Knowledge limits and human use of output, summary: "Information about the AI system's knowledge limits and how system output may be utilized and overseen by humans is documented.", controls: [DEV-01, TRN-02], weight: 2}
      - {ref: MAP 2.3, title: Scientific integrity and TEVV, summary: "Scientific integrity and TEVV considerations are identified and documented, including those related to experimental design, data collection and selection, system trustworthiness, and construct validation.", controls: [DAT-01, DEV-02], weight: 2}
      - {ref: MAP 3.1, title: Benefits documented, summary: "Potential benefits of intended AI system functionality and performance are examined and documented.", controls: [RSK-03], weight: 1}
      - {ref: MAP 3.2, title: Costs of errors documented, summary: "Potential costs, including non-monetary costs, which result from expected or realized AI errors or system functionality and trustworthiness are examined and documented.", controls: [RSK-03], weight: 2}
      - {ref: MAP 3.3, title: Application scope, summary: "Targeted application scope is specified and documented based on the system's capability, established context, and AI system categorization.", controls: [RSK-01, DEV-01], weight: 2}
      - {ref: MAP 3.4, title: Operator proficiency, summary: "Processes for operator and practitioner proficiency with AI system performance and trustworthiness, and relevant technical standards and certifications, are defined, assessed, and documented.", controls: [GOV-05], weight: 2}
      - {ref: MAP 3.5, title: Human oversight processes, summary: "Processes for human oversight are defined, assessed, and documented in accordance with organizational policies.", controls: [HUM-01], weight: 3}
      - {ref: MAP 4.1, title: Mapping legal and technology risks of components, summary: "Approaches for mapping AI technology and legal risks of its components, including the use of third-party data or software, are in place, followed, and documented, as are risks of infringement of a third party's intellectual property or other rights.", controls: [TPR-01], weight: 2}
      - {ref: MAP 4.2, title: Internal risk controls for components, summary: "Internal risk controls for components of the AI system, including third-party AI technologies, are identified and documented.", controls: [TPR-02], weight: 2}
      - {ref: MAP 5.1, title: Likelihood and magnitude of impacts, summary: "Likelihood and magnitude of each identified impact (both potentially beneficial and harmful) based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback from those external to the team, or other data are identified and documented.", controls: [RSK-02, RSK-03], weight: 3}
      - {ref: MAP 5.2, title: Engagement with affected actors, summary: "Practices and personnel for supporting regular engagement with relevant AI actors and integrating feedback about positive, negative, and unanticipated impacts are in place and documented.", controls: [HUM-02], weight: 1}

  - chapter: MEASURE
    items:
      - {ref: MEASURE 1.1, title: Metrics selected, summary: "Approaches and metrics for measurement of AI risks enumerated during the MAP function are selected for implementation starting with the most significant AI risks. The risks or trustworthiness characteristics that will not or cannot be measured are properly documented.", controls: [DEV-02], weight: 2}
      - {ref: MEASURE 1.2, title: Metrics reviewed, summary: "Appropriateness of AI metrics and effectiveness of existing controls are regularly assessed and updated, including reports of errors and potential impacts on affected communities.", controls: [OPS-02], weight: 2}
      - {ref: MEASURE 1.3, title: Independent assessment, summary: "Internal experts who did not serve as front-line developers for the system and/or independent assessors are involved in regular assessments and updates.", controls: [GOV-06], weight: 2}
      - {ref: MEASURE 2.1, title: TEVV documentation, summary: "Test sets, metrics, and details about the tools used during TEVV are documented.", controls: [DEV-02, DAT-01], weight: 2}
      - {ref: MEASURE 2.2, title: Human-subject evaluations, summary: "Evaluations involving human subjects meet applicable requirements (including human subject protection) and are representative of the relevant population.", controls: [DEV-02], weight: 1}
      - {ref: MEASURE 2.3, title: Performance in deployment-like conditions, summary: "AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s). Measures are documented.", controls: [DEV-02], weight: 3}
      - {ref: MEASURE 2.4, title: Production monitoring, summary: "The functionality and behavior of the AI system and its components are monitored when in production.", controls: [OPS-02], weight: 3}
      - {ref: MEASURE 2.5, title: Validity and reliability, summary: "The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions under which the technology was developed are documented.", controls: [DEV-02, DEV-01], weight: 2}
      - {ref: MEASURE 2.6, title: Safety evaluation, summary: "The AI system is evaluated regularly for safety risks. The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits.", controls: [DEV-02, GEN-01], weight: 2}
      - {ref: MEASURE 2.7, title: Security and resilience, summary: "AI system security and resilience are evaluated and documented.", controls: [DEV-04], weight: 3}
      - {ref: MEASURE 2.8, title: Transparency and accountability risks, summary: "Risks associated with transparency and accountability are examined and documented.", controls: [TRN-02, OPS-01], weight: 2}
      - {ref: MEASURE 2.9, title: Explainability, summary: "The AI model is explained, validated, and documented, and AI system output is interpreted within its context to inform responsible use and governance.", controls: [TRN-03], weight: 2}
      - {ref: MEASURE 2.10, title: Privacy risk, summary: "Privacy risk of the AI system is examined and documented.", controls: [DAT-03], weight: 2}
      - {ref: MEASURE 2.11, title: Fairness and bias, summary: "Fairness and bias are evaluated and results are documented.", controls: [DEV-03, DAT-02], weight: 3}
      - {ref: MEASURE 2.12, title: Environmental impact, summary: "Environmental impact and sustainability of AI model training and management activities are assessed and documented.", controls: [DEV-01], weight: 1}
      - {ref: MEASURE 2.13, title: Effectiveness of TEVV, summary: "Effectiveness of the employed TEVV metrics and processes in the MEASURE function are evaluated and documented.", controls: [GOV-06], weight: 1}
      - {ref: MEASURE 3.1, title: Tracking emergent risks, summary: "Approaches, personnel, and documentation are in place to regularly identify and track existing, unanticipated, and emergent AI risks based on factors such as intended and actual performance in deployed contexts.", controls: [OPS-02, RSK-02], weight: 2}
      - {ref: MEASURE 3.2, title: Hard-to-measure risks, summary: "Risk tracking approaches are considered for settings where AI risks are difficult to assess using currently available measurement techniques or where metrics are not yet available.", controls: [RSK-02], weight: 1}
      - {ref: MEASURE 3.3, title: User feedback and appeal, summary: "Feedback processes for end users and impacted communities to report problems and appeal system outcomes are established and integrated into AI system evaluation metrics.", controls: [HUM-02], weight: 2}
      - {ref: MEASURE 4.1, title: Context-informed measurement, summary: "Measurement approaches for identifying AI risks are connected to deployment context(s) and informed through consultation with domain experts and other end users. Approaches are documented.", controls: [DEV-02], weight: 1}
      - {ref: MEASURE 4.2, title: Validated trustworthiness in deployment, summary: "Measurement results regarding AI system trustworthiness in deployment context(s) and across the AI lifecycle are informed by input from domain experts and relevant AI actors to validate whether the system is performing consistently as intended. Results are documented.", controls: [OPS-02], weight: 2}
      - {ref: MEASURE 4.3, title: Measured improvements and declines, summary: "Measurable performance improvements or declines based on consultations with relevant AI actors, including affected communities, and field data about context-relevant risks and trustworthiness characteristics are identified and documented.", controls: [OPS-02], weight: 1}

  - chapter: MANAGE
    items:
      - {ref: MANAGE 1.1, title: Go / no-go determination, summary: "A determination is made as to whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed.", controls: [DEV-02, RSK-02], weight: 3}
      - {ref: MANAGE 1.2, title: Risk treatment prioritised, summary: "Treatment of documented AI risks is prioritized based on impact, likelihood, and available resources or methods.", controls: [RSK-02], weight: 2}
      - {ref: MANAGE 1.3, title: Responses to high-priority risks, summary: "Responses to the AI risks deemed high priority, as identified by the MAP function, are developed, planned, and documented. Risk response options can include mitigating, transferring, avoiding, or accepting.", controls: [RSK-02], weight: 3}
      - {ref: MANAGE 1.4, title: Residual risk documented, summary: "Negative residual risks (defined as the sum of all unmitigated risks) to both downstream acquirers of AI systems and end users are documented.", controls: [RSK-02, TRN-02], weight: 2}
      - {ref: MANAGE 2.1, title: Resources and non-AI alternatives, summary: "Resources required to manage AI risks are taken into account along with viable non-AI alternative systems, approaches, or methods to reduce the magnitude or likelihood of potential impacts.", controls: [RSK-02], weight: 1}
      - {ref: MANAGE 2.2, title: Sustaining value, summary: "Mechanisms are in place and applied to sustain the value of deployed AI systems.", controls: [OPS-02], weight: 1}
      - {ref: MANAGE 2.3, title: Responding to unknown risks, summary: "Procedures are followed to respond to and recover from a previously unknown risk when it is identified.", controls: [OPS-03], weight: 2}
      - {ref: MANAGE 2.4, title: Disengage or deactivate, summary: "Mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use.", controls: [HUM-01, OPS-04], weight: 3}
      - {ref: MANAGE 3.1, title: Third-party risk monitoring, summary: "AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented.", controls: [TPR-01, TPR-02], weight: 2}
      - {ref: MANAGE 3.2, title: Pre-trained model monitoring, summary: "Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance.", controls: [TPR-02], weight: 2}
      - {ref: MANAGE 4.1, title: Post-deployment monitoring plans, summary: "Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management.", controls: [OPS-02, OPS-01, DEV-05], weight: 3}
      - {ref: MANAGE 4.2, title: Continual improvement, summary: "Measurable activities for continual improvements are integrated into AI system updates and include regular engagement with interested parties, including relevant AI actors.", controls: [DEV-05], weight: 1}
      - {ref: MANAGE 4.3, title: Incident communication and recovery, summary: "Incidents and errors are communicated to relevant AI actors, including affected communities. Processes for tracking, responding to, and recovering from incidents and errors are followed and documented.", controls: [OPS-03], weight: 3}
