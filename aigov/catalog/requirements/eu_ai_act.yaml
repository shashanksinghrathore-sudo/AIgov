        title: Codes of conduct for voluntary application of specific requirements
        when: [provider, deployer]
        binding: false
        summary: For AI systems that are not high-risk, the entity has considered voluntarily applying high-risk requirements or a code of conduct (for example on sustainability, accessibility, inclusive design and AI literacy).
