# ISO/IEC 42001:2023 and the OECD AI Principles.
# ISO/IEC 42001 is a copyrighted standard: titles and summaries here are short paraphrases written for
# assessment, not the standard's text. Use a licensed copy of the standard for the actual requirements.

frameworks:
  - framework: iso_42001
    prefix: ISO42001
    sections:
      - chapter: Clause 4 - Context of the organization
        items:
          - {ref: "4.1", title: Understanding the organization and its context, summary: "External and internal issues relevant to the organisation's purpose and its AI roles (provider, producer, customer, user) are determined, including climate change where relevant.", controls: [GOV-04], weight: 2}
          - {ref: "4.2", title: Understanding the needs and expectations of interested parties, summary: "Interested parties relevant to the AI management system and their requirements (including legal requirements) are determined.", controls: [GOV-04], weight: 2}
          - {ref: "4.3", title: Determining the scope of the AI management system, summary: "The boundaries and applicability of the AI management system are determined and documented.", controls: [GOV-03], weight: 2}
          - {ref: "4.4", title: AI management system, summary: "An AI management system, including its processes and interactions, is established, implemented, maintained and continually improved.", controls: [GOV-01], weight: 3}
      - chapter: Clause 5 - Leadership
        items:
          - {ref: "5.1", title: Leadership and commitment, summary: "Top management demonstrates leadership and commitment - AI policy and objectives aligned to strategy, requirements integrated into business processes, resources available, and the AIMS achieving its intended results.", controls: [GOV-02], weight: 3}
          - {ref: "5.2", title: AI policy, summary: "Top management establishes an AI policy appropriate to the organisation, providing a framework for AI objectives and commitments to meet requirements and continually improve; it is documented, communicated and available.", controls: [GOV-01], weight: 3}
          - {ref: "5.3", title: "Roles, responsibilities and authorities", summary: "Responsibilities and authorities for relevant roles are assigned and communicated, including for conformity of the AIMS and reporting on its performance.", controls: [GOV-02], weight: 3}
      - chapter: Clause 6 - Planning
        items:
          - {ref: "6.1.1", title: Actions to address risks and opportunities - general, summary: "Risks and opportunities affecting the AIMS are determined and actions planned, with criteria distinguishing acceptable from non-acceptable risks.", controls: [RSK-02], weight: 2}
          - {ref: "6.1.2", title: AI risk assessment, summary: "A defined, repeatable AI risk assessment process identifies, analyses and evaluates AI risks, with documented results.", controls: [RSK-02, RSK-01], weight: 3}
          - {ref: "6.1.3", title: AI risk treatment, summary: "Risk treatment options are selected, necessary controls determined and compared with Annex A, a statement of applicability produced with justifications, and a treatment plan approved.", controls: [RSK-02], weight: 3}
          - {ref: "6.1.4", title: AI system impact assessment, summary: "A process assesses the potential consequences of AI systems for individuals, groups and societies, and results are documented and considered in risk assessment.", controls: [RSK-03], weight: 3}
          - {ref: "6.2", title: AI objectives and planning to achieve them, summary: "Measurable AI objectives are set at relevant functions and levels, with plans stating what will be done, resources, responsibility, timing and evaluation.", controls: [GOV-01], weight: 2}
          - {ref: "6.3", title: Planning of changes, summary: "Changes to the AI management system are carried out in a planned manner.", controls: [DEV-05], weight: 1}
      - chapter: Clause 7 - Support
        items:
          - {ref: "7.1", title: Resources, summary: "Resources needed for the AI management system are determined and provided.", controls: [GOV-02], weight: 1}
          - {ref: "7.2", title: Competence, summary: "Necessary competence for people affecting AI performance is determined, ensured through education, training or experience, and evidenced.", controls: [GOV-05], weight: 2}
          - {ref: "7.3", title: Awareness, summary: "People are aware of the AI policy, their contribution to the AIMS and the implications of not conforming.", controls: [GOV-05], weight: 1}
          - {ref: "7.4", title: Communication, summary: "Internal and external communications relevant to the AIMS (what, when, with whom, how) are determined.", controls: [TRN-02], weight: 1}
          - {ref: "7.5", title: Documented information, summary: "Documented information required by the standard and the organisation is created, updated and controlled.", controls: [DEV-01, OPS-01], weight: 2}
      - chapter: Clause 8 - Operation
        items:
          - {ref: "8.1", title: Operational planning and control, summary: "Processes needed to meet requirements are planned, implemented and controlled, including outsourced processes, with criteria and documented evidence.", controls: [DEV-05, TPR-01], weight: 2}
          - {ref: "8.2", title: AI risk assessment (operation), summary: "AI risk assessments are performed at planned intervals or when significant changes occur, and results retained.", controls: [RSK-02], weight: 2}
          - {ref: "8.3", title: AI risk treatment (operation), summary: "The AI risk treatment plan is implemented and its effectiveness verified, with results retained.", controls: [RSK-02], weight: 2}
          - {ref: "8.4", title: AI system impact assessment (operation), summary: "AI system impact assessments are performed at planned intervals or when significant changes occur, and results retained.", controls: [RSK-03], weight: 2}
      - chapter: Clause 9 - Performance evaluation
        items:
          - {ref: "9.1", title: "Monitoring, measurement, analysis and evaluation", summary: "What is monitored and measured, methods, timing and evaluation of AIMS performance and effectiveness are determined and evidenced.", controls: [OPS-02, GOV-06], weight: 2}
          - {ref: "9.2", title: Internal audit, summary: "Internal audits are conducted at planned intervals against an audit programme, by objective auditors, with results reported to management.", controls: [GOV-06], weight: 3}
          - {ref: "9.3", title: Management review, summary: "Top management reviews the AIMS at planned intervals, considering changes, performance, audit results and improvement opportunities.", controls: [GOV-06], weight: 2}
      - chapter: Clause 10 - Improvement
        items:
          - {ref: "10.1", title: Continual improvement, summary: "The suitability, adequacy and effectiveness of the AIMS are continually improved.", controls: [GOV-06], weight: 1}
          - {ref: "10.2", title: Nonconformity and corrective action, summary: "Nonconformities are reacted to, causes analysed, corrective actions taken and their effectiveness reviewed, with evidence retained.", controls: [GOV-06, OPS-03], weight: 2}
      - chapter: Annex A.2 - Policies related to AI
        items:
          - {ref: A.2.2, title: AI policy, summary: "A documented policy for the development or use of AI systems is in place.", controls: [GOV-01], weight: 3}
          - {ref: A.2.3, title: Alignment with other organizational policies, summary: "Other organisational policies affected by or applicable to AI (security, privacy, quality, procurement) are identified and aligned with the AI policy.", controls: [GOV-01], weight: 1}
          - {ref: A.2.4, title: Review of the AI policy, summary: "The AI policy is reviewed at planned intervals or when needed to stay suitable, adequate and effective.", controls: [GOV-01], weight: 1}
      - chapter: Annex A.3 - Internal organization
        items:
          - {ref: A.3.2, title: AI roles and responsibilities, summary: "Roles and responsibilities for AI are defined and allocated according to the organisation's needs.", controls: [GOV-02], weight: 3}
          - {ref: A.3.3, title: Reporting of concerns, summary: "A process lets people report concerns about the organisation's role with respect to AI systems throughout their lifecycle.", controls: [GOV-02], weight: 2}
      - chapter: Annex A.4 - Resources for AI systems
        items:
          - {ref: A.4.2, title: Resource documentation, summary: "Resources required for each AI system lifecycle stage and related activities are identified and documented.", controls: [GOV-03], weight: 1}
          - {ref: A.4.3, title: Data resources, summary: "Information about the data resources used for each AI system is documented.", controls: [DAT-01], weight: 2}
          - {ref: A.4.4, title: Tooling resources, summary: "Information about tooling resources (algorithms, frameworks, development and deployment tools) is documented.", controls: [DEV-05, TPR-02], weight: 1}
          - {ref: A.4.5, title: System and computing resources, summary: "Information about system and computing resources used by AI systems is documented.", controls: [DEV-04], weight: 1}
          - {ref: A.4.6, title: Human resources, summary: "Information about the human resources and competences used for AI systems is documented.", controls: [GOV-05], weight: 1}
      - chapter: Annex A.5 - Assessing impacts of AI systems
        items:
          - {ref: A.5.2, title: AI system impact assessment process, summary: "A process exists to assess potential consequences of AI systems for individuals, groups and societies across the lifecycle.", controls: [RSK-03], weight: 3}
          - {ref: A.5.3, title: Documentation of AI system impact assessments, summary: "Impact assessment results are documented and retained for a defined period.", controls: [RSK-03], weight: 2}
          - {ref: A.5.4, title: Assessing AI system impact on individuals or groups of individuals, summary: "Impacts on individuals and groups (fairness, rights, safety, privacy) are assessed and documented.", controls: [RSK-03, DEV-03], weight: 2}
          - {ref: A.5.5, title: Assessing societal impacts of AI systems, summary: "Potential societal impacts are assessed and documented.", controls: [RSK-03], weight: 1}
      - chapter: Annex A.6 - AI system life cycle
        items:
          - {ref: A.6.1.2, title: Objectives for responsible development of AI system, summary: "Objectives guiding responsible AI development are identified, documented and integrated into the development lifecycle.", controls: [GOV-01, DEV-01], weight: 2}
          - {ref: A.6.1.3, title: Processes for responsible AI system design and development, summary: "Processes for responsible design and development are defined and documented.", controls: [DEV-05], weight: 2}
          - {ref: A.6.2.2, title: AI system requirements and specification, summary: "Requirements for new AI systems or material enhancements are specified and documented.", controls: [DEV-01], weight: 2}
          - {ref: A.6.2.3, title: Documentation of AI system design and development, summary: "Design and development of AI systems is documented based on objectives, requirements and specification criteria.", controls: [DEV-01, DEV-05], weight: 2}
          - {ref: A.6.2.4, title: AI system verification and validation, summary: "Verification and validation measures and their criteria are defined and documented.", controls: [DEV-02, DEV-03, DEV-04], weight: 3}
          - {ref: A.6.2.5, title: AI system deployment, summary: "A deployment plan is documented and requirements are met before deployment.", controls: [DEV-05, RSK-04], weight: 2}
          - {ref: A.6.2.6, title: AI system operation and monitoring, summary: "Elements needed for ongoing operation (monitoring, repairs, updates, support) are defined and documented.", controls: [OPS-02, OPS-04], weight: 3}
          - {ref: A.6.2.7, title: AI system technical documentation, summary: "Technical documentation needed by each category of interested party (users, partners, authorities) is determined and provided.", controls: [DEV-01], weight: 2}
          - {ref: A.6.2.8, title: AI system recording of event logs, summary: "The lifecycle phases in which event logging is enabled are determined, at a minimum while the system is in use.", controls: [OPS-01], weight: 2}
      - chapter: Annex A.7 - Data for AI systems
        items:
          - {ref: A.7.2, title: Data for development and enhancement of AI system, summary: "Data management processes for development and enhancement of AI systems are defined, documented and implemented.", controls: [DAT-01], weight: 2}
          - {ref: A.7.3, title: Acquisition of data, summary: "Details about acquisition and selection of data used in AI systems are determined and documented.", controls: [DAT-01, DAT-03], weight: 2}
          - {ref: A.7.4, title: Quality of data for AI systems, summary: "Data quality requirements are defined, documented and met by data used to develop and operate AI systems.", controls: [DAT-01, DAT-02], weight: 3}
          - {ref: A.7.5, title: Data provenance, summary: "A process records the provenance of data used in AI systems over the data and system lifecycles.", controls: [DAT-01], weight: 2}
          - {ref: A.7.6, title: Data preparation, summary: "Criteria for selecting data preparations and the methods used are defined and documented.", controls: [DAT-01], weight: 1}
      - chapter: Annex A.8 - Information for interested parties of AI systems
        items:
          - {ref: A.8.2, title: System documentation and information for users, summary: "Information users need about the AI system is determined and provided.", controls: [TRN-02, TRN-01], weight: 2}
          - {ref: A.8.3, title: External reporting, summary: "Interested parties can report adverse impacts of the AI system.", controls: [HUM-02], weight: 2}
          - {ref: A.8.4, title: Communication of incidents, summary: "A plan exists for communicating incidents to users of the AI system.", controls: [OPS-03], weight: 2}
          - {ref: A.8.5, title: Information for interested parties, summary: "Obligations to report information about AI systems to interested parties (including authorities) are determined and documented.", controls: [TRN-04, GOV-04], weight: 1}
      - chapter: Annex A.9 - Use of AI systems
        items:
          - {ref: A.9.2, title: Processes for responsible use of AI systems, summary: "Processes for the responsible use of AI systems are defined and documented.", controls: [HUM-01, GEN-01], weight: 2}
          - {ref: A.9.3, title: Objectives for responsible use of AI system, summary: "Objectives guiding responsible use of AI systems are identified and documented.", controls: [GOV-01], weight: 1}
          - {ref: A.9.4, title: Intended use of the AI system, summary: "AI systems are used according to their intended uses and accompanying documentation.", controls: [TRN-02, HUM-01], weight: 2}
      - chapter: Annex A.10 - Third-party and customer relationships
        items:
          - {ref: A.10.2, title: Allocating responsibilities, summary: "Responsibilities within the AI lifecycle are allocated between the organisation, its partners, suppliers, customers and third parties.", controls: [TPR-01], weight: 2}
          - {ref: A.10.3, title: Suppliers, summary: "A process ensures that services, products or materials from suppliers align with the organisation's approach to responsible AI.", controls: [TPR-01, TPR-02], weight: 2}
          - {ref: A.10.4, title: Customers, summary: "The organisation's responsible approach to AI takes customers' expectations and needs into account.", controls: [TRN-02], weight: 1}

  - framework: oecd_ai
    prefix: OECD
    sections:
      - chapter: Section 1 - Principles for responsible stewardship of trustworthy AI
        items:
          - {ref: "1.1", title: "Inclusive growth, sustainable development and well-being", summary: "AI is used to pursue beneficial outcomes for people and the planet, reducing inequalities and protecting natural environments.", controls: [RSK-03], weight: 1}
          - {ref: "1.2", title: "Respect for the rule of law, human rights and democratic values, including fairness and privacy", summary: "Safeguards respect human rights, non-discrimination, privacy and fairness, with human agency and oversight appropriate to the context.", controls: [DEV-03, DAT-03, HUM-01], weight: 3}
          - {ref: "1.3", title: Transparency and explainability, summary: "Meaningful information is provided so people understand when they interact with AI and can understand and challenge outcomes.", controls: [TRN-01, TRN-03], weight: 2}
          - {ref: "1.4", title: "Robustness, security and safety", summary: "AI systems are robust, secure and safe throughout their lifecycle, with mechanisms to override, repair or decommission them if they risk undue harm.", controls: [DEV-02, DEV-04, OPS-04], weight: 3}
          - {ref: "1.5", title: Accountability, summary: "AI actors are accountable for the proper functioning of AI systems, with traceability of datasets, processes and decisions and systematic risk management.", controls: [GOV-02, OPS-01, RSK-02], weight: 3}
      - chapter: Section 2 - National policies and international co-operation
        items:
          - {ref: "2.1", title: Investing in AI research and development, kind: info, note: Recommendation addressed to governments.}
          - {ref: "2.2", title: Fostering an inclusive AI-enabling ecosystem, kind: info, note: Recommendation addressed to governments.}
          - {ref: "2.3", title: Enabling an interoperable governance and policy environment for AI, kind: info, note: Recommendation addressed to governments.}
          - {ref: "2.4", title: Building human capacity and preparing for labour market transition, kind: info, note: Recommendation addressed to governments.}
          - {ref: "2.5", title: International co-operation for trustworthy AI, kind: info, note: Recommendation addressed to governments.}
