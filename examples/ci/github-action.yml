# Copy to .github/workflows/ai-governance.yml in the repository you want to gate.
name: AI governance gate
on: [pull_request]
jobs:
  aigov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "aigov[ai] @ git+https://YOUR-GIT-HOST/your-org/aigov.git"
      - run: aigov assess -c governance/aigov.yaml --out aigov-report --fail-on critical
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # omit to run the offline rule-based check
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: aigov-report, path: aigov-report}
